name: OpenCode GitHub Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar OpenCode Action
        uses: opencode-ai/opencode-action@v1
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
